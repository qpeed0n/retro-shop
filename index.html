<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/style.css">
    <title>Retro shop</title>
</head>
<body>
    <section class="player" id="player">
        <div class="player__info">
            <div class="player__info-image">
                <img src="images/" id="infoImage">
            </div>
            <div class="player__info-name">
                <p class="info-name__text" id="infoName"></p>
            </div>
        </div>

        <div class="player__control">
            <div class="player__control-play">
                <img src="images/" id="controlPlay">
            </div>
            <div class="player__control-pause">
                <img src="images/" id="controlPause">
            </div>
        </div>

        <div class="player__timer">
            <p class="player__timer-text" id="playerTimer"></p>
        </div>
    </section>
    

    <script src="script/script.js"></script>
</body>
</html>

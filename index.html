<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../retro-shop/styles/style.css">
    <title>Retro shop</title>
</head>

<body>
    <section class="catalog">
        <div class="catalog__text">
            <div class="catalog__text-h">
                <h2>Наш каталог</h2>
            </div>
            <div class="catalog__text-p">
                <p>Показать все -></p>
            </div>
        </div>
        <div class="catalog__main">
            <div class="catalog__main-card">
                <div class="catalog__main-img">
                    <img src="images/rain.png" alt="rain">

                    <button type="button" class="catalog__main-listen" data-audio="audio/rain.mp3"
                        data-cover="images/rain.png" data-title="Звуки Дождя и Грозы"
                        aria-label="Слушать Звуки Дождя и Грозы">
                        <img src="images/play.png" alt="">
                        <span>0:15</span>
                    </button>
                </div>
                <div class="catalog__main-text">
                    <div class="main-text__name">
                        <p>Звуки Дождя и Грозы</p>
                    </div>
                    <div class="main-text__description">
                        <p>Гроза, ливень, ночь | 60 мин</p>
                    </div>
                    <div class="main-text__price">
                        <p>690 Руб.</p>
                    </div>
                </div>
                <div class="catalog__main-busket">
                    <button id="btnPlay" class="btn">В корзину</button>
                </div>
            </div>

            <div class="catalog__main-card">
                <div class="catalog__main-img">
                    <img src="images/bird.png" alt="rain">

                    <button type="button" class="catalog__main-listen" data-audio="audio/bird.mp3"
                        data-cover="images/bird.png" data-title="Пение Птиц" aria-label="Слушать Пение Птиц">
                        <img src="images/play.png" alt="">
                        <span>0:15</span>
                    </button>
                </div>
                <div class="catalog__main-text">
                    <div class="main-text__name">
                        <p>Пение Птичек</p>
                    </div>
                    <div class="main-text__description">
                        <p>Утро, солнце и композиция птиц | 60 мин</p>
                    </div>
                    <div class="main-text__price">
                        <p>490 Руб.</p>
                    </div>
                </div>
                <div class="catalog__main-busket">
                    <button id="btnPlay" class="btn">В корзину</button>
                </div>
            </div>

            <div class="catalog__main-card">
                <div class="catalog__main-img">
                    <img src="images/sea.png" alt="rain">

                    <button type="button" class="catalog__main-listen" data-audio="audio/sea.mp3"
                        data-cover="images/sea.png" data-title="Звуки Моря" aria-label="Слушать Звуки Моря">
                        <img src="images/play.png" alt="">
                        <span>0:15</span>
                    </button>
                </div>
                <div class="catalog__main-text">
                    <div class="main-text__name">
                        <p>Звуки Моря</p>
                    </div>
                    <div class="main-text__description">
                        <p>Закат, прохладный ветер, шум прибоя | 60 мин</p>
                    </div>
                    <div class="main-text__price">
                        <p>590 Руб.</p>
                    </div>
                </div>
                <div class="catalog__main-busket">
                    <button id="btnPlay" class="btn">В корзину</button>
                </div>
            </div>

            <div class="catalog__main-card">
                <div class="catalog__main-img">
                    <img src="images/tropic-bird.png" alt="rain">

                    <button type="button" class="catalog__main-listen" data-audio="audio/tropic-bird.mp3"
                        data-cover="images/tropic-bird.png" data-title="Пение Тропических Птиц"
                        aria-label="Слушать Пение Тропических Птиц">
                        <img src="images/play.png" alt="">
                        <span>0:15</span>
                    </button>
                </div>
                <div class="catalog__main-text">
                    <div class="main-text__name">
                        <p>Пение Тропических Птиц</p>
                    </div>
                    <div class="main-text__description">
                        <p>Гроза, ливень, ночь | 60 мин</p>
                    </div>
                    <div class="main-text__price">
                        <p>790 Руб.</p>
                    </div>
                </div>
                <div class="catalog__main-busket">
                    <button id="btnPlay" class="btn">В корзину</button>
                </div>
            </div>
        </div>

    </section>

    <section class="player hidden" id="player">
        <div class="player__info">
            <div class="player__info-image">
                <img id="infoImage" src="" alt="">
            </div>

            <div class="player__info-name">
                <p id="infoName"></p>
            </div>
        </div>

        <div class="player__control">
            <button type="button" id="controlPlay" aria-label="Продолжить">
                <img src="images/play.png" alt="">
            </button>

            <button type="button" id="controlPause" aria-label="Пауза">
                <img src="images/pause.png" alt="">
            </button>
        </div>

        <div class="player__timer">
            <span id="playerTimer">0:00</span>
        </div>
    </section>

    <audio id="audioPlayer" preload="metadata"></audio>

    <footer id="siteFooter" class="site-footer"></footer>


    <script src="script/script.js"></script>
</body>

</html>
